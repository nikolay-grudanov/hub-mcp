[project]
name = "hub-mcp"
version = "0.1.0"
description = "Per-profile MCP hub for Hermes / GigaCode / Claude Code / Qwen / OpenCode"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# `uv sync` (default) installs runtime + [dependency-groups] dev.
# `uv sync --extra NAME` would also work for ad-hoc groups.

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.5.0",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src/hub_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_mcp"]